# Deploy Web to Vercel
#
# Builds the IKEAR Expo app for the web platform and deploys the static
# `dist` output to Vercel on every push to `main` (also runnable manually).
#
# SECURITY NOTES:
# - This is a PRIVATE repo, but the published site is a PUBLIC URL on Vercel's
#   free (Hobby) tier. That is expected and fine for a public marketing/web app.
# - EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY are PUBLIC by
#   design: Expo inlines EXPO_PUBLIC_* vars into the client bundle. The Supabase
#   anon key is meant to be shipped to the browser. Row Level Security (RLS) on
#   the Supabase side is the real security boundary — never rely on the anon key
#   being secret, and never expose the service_role key here.
#
# REQUIRED SECRETS (repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY

name: Deploy Web to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 没有提交 package-lock.json，故不能用 `cache: npm`（找不到 lock 文件会失败）
      # 也不能用 `npm ci`。提交 lockfile 后应改回 npm ci + cache。
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # secrets 通过 env 传入而不是直接插值进 shell，避免特殊字符破坏脚本；
      # 缺失时直接失败，否则会静默产出一个「回落到 mock 数据」的线上站点。
      - name: Export public env (inlined at build time)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少 EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY Secrets，构建会静默回落到 mock 数据源，已中止部署。"
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Export Expo web bundle
        run: npx expo export --platform web

      # 下面的部署以 `dist` 为项目根目录上传，仓库根的 vercel.json 不会随之生效，
      # 因此在这里补一份「只含 SPA 回退」的静态配置，避免深链（/listing/xxx）404。
      # 注意：不能直接复制根 vercel.json —— 它带 buildCommand，会让 Vercel 在 dist 里重新构建。
      - name: Write SPA rewrite config into dist
        run: |
          echo '{"rewrites":[{"source":"/(.*)","destination":"/index.html"}]}' > dist/vercel.json

      # --- Deploy to Vercel (primary) ---------------------------------------
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: dist
          vercel-args: '--prod'

      # --- ALTERNATIVE: deploy the SAME dist to Cloudflare Pages ------------
      # Uncomment the block below (and remove/comment the Vercel step above)
      # to publish `dist` to Cloudflare Pages instead.
      #
      # REQUIRED SECRETS for this path:
      #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
      #   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY
      #
      # - name: Deploy to Cloudflare Pages
      #   uses: cloudflare/pages-action@v1
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     projectName: ikear-web
      #     directory: dist
      #     # gitHubToken is used to update deployment statuses on the PR/commit
      #     gitHubToken: ${{ secrets.GITHUB_TOKEN }}
